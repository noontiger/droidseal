name: Feature request
description: 建议防御性 APK 发布工作流改进
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 描述用户目标，不要只描述按钮或实现方式
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 安全与兼容性影响
      description: 说明对 APK、密钥、外部命令、平台兼容和回退的影响
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 功能用于自己拥有或获授权应用的防御性构建、审计、签名或保护
          required: true
