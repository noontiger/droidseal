name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Package Windows x64 zip
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $zipName = "droidseal-$version-windows-x64.zip"
          Compress-Archive -Path dist\* -DestinationPath $zipName -CompressionLevel Optimal
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          @"
          ## DroidSeal $version(Windows x64)

          - 解压 zip 后直接运行 `droidseal.exe`(无需安装)
          - 其他安装方式:`npm install --global droidseal`;或从源码构建(需 Bun 1.3+,步骤见仓库 README「快速开始」)
          - 构建 commit:`${{ github.sha }}`
          - SHA-256:`$hash`
          "@ | Out-File -FilePath release_body.md -Encoding utf8
      - uses: softprops/action-gh-release@v2
        with:
          name: DroidSeal ${{ github.ref_name }}
          body_path: release_body.md
          files: ${{ steps.package.outputs.zip_name }}
